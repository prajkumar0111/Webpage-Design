<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="navbar">
            <div class="icon">
                <h2 class="logo">codefusion</h2>
                
            </div>

            <div class="menu">
                
                <ul>
                    <li><li><li><li></li></li></li></li>
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">ABOUT</a></li>
                    <li><a href="#">BIO</a></li>
                    <li><a href="#">CONTACT</a></li>
                </ul>
                
            </div>
    <div class="container">
        <div class="slide">
            <div class="item" style="background: url('image/File\ 1.png') no-repeat center center / cover;">
                
            </div>

            <div class="item" style="background: url('image/File\ 2.png') no-repeat center center / cover;">
                
            </div>

            <div class="item" style="background: url('image/File\ 3.jpg')no-repeat center center / cover;">
                
            </div>

            <div class="item" style="background: url('image/File\ 4.jpg')no-repeat center center / cover;">
                
            </div>

            <div class="item" style="background: url('image/File\ 5.png')no-repeat center center / cover;">
                
                    
            </div>

            <div class="item" style="background: url('image/File\ 6.png')no-repeat center center / cover;">
                
            </div>
           
            
            <div class="item" style="background: url('image/File\ 7.png')no-repeat center center / cover;">
               
            </div>
            <div class="item" style="background: url('image/File\ 8.png')no-repeat center center / cover;">
               
            </div>
            <div class="item" style="background: url('image/File\ 9.png')no-repeat center center / cover;">
               
            </div>
            <div class="item" style="background: url('image/File\ 10.png')no-repeat center center / cover;">
               
            </div>
        </div>

        <div class="button">
            <button class="prev"><i class="fa-solid fa-arrow-left"></i></button>
            <button class="next"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
